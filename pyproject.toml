[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resq-ai"
version = "1.0.0"
description = "Real-Time AI Emergency Decision-Support System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ResQ-AI Team" }
]

[tool.setuptools.packages.find]
where = ["src"]
